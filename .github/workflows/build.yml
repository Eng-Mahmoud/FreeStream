name: Build iPhone prototype
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Detect CarPlay video SDK
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          HEADERS="$SDK_PATH/System/Library/Frameworks/CarPlay.framework/Headers"
          if test -f "$HEADERS/CPPlaybackConfiguration.h" && rg -q 'supportsVideoPlayback|videoPlaybackSupported' "$HEADERS/CPSessionConfiguration.h" && rg -q 'CPPlayableItem' "$HEADERS/CPListItem.h"; then
            echo 'VIDEO_SWIFT_FLAGS=FREESTREAM_VIDEO_SDK' >> "$GITHUB_ENV"
            echo 'CarPlay video APIs present.'
          else
            echo 'VIDEO_SWIFT_FLAGS=' >> "$GITHUB_ENV"
            echo '::warning::SDK lacks CarPlay video APIs. This build includes CarPlay audio browsing only. Use a runner with a compatible Xcode SDK for video.'
          fi
      - name: Build unsigned device app
        run: xcodebuild -project FreeStream.xcodeproj -scheme FreeStream -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO SWIFT_ACTIVE_COMPILATION_CONDITIONS="$VIDEO_SWIFT_FLAGS" build
      - name: Package for local signing
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/FreeStream.app package/Payload/
          cd package
          zip -qr ../MahmoudTV-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MahmoudTV-unsigned
          path: MahmoudTV-unsigned.ipa
