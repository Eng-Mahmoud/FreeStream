name: FreeStream
options:
  bundleIdPrefix: com.freestream.prototype
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGNING_ALLOWED: NO
targets:
  FreeStream:
    type: application
    platform: iOS
    sources: [Sources]
    entitlements:
      path: Generated/FreeStream.entitlements
      properties:
        com.apple.developer.carplay-audio: true
        com.apple.developer.carplay-video: true
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: MahmoudTV
        CFBundleShortVersionString: '0.2.1'
        CFBundleVersion: '3'
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes: [audio]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        NSLocalNetworkUsageDescription: Discover and connect to local AirPlay receivers.
schemes:
  FreeStream:
    build:
      targets:
        FreeStream: all
